<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9a441; --gold2:#f5d27a; --panel:#1a1410; --text:#e9dcc2; --dim:#9c8d74}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050403;color:var(--text);font-family:'Alegreya',Georgia,serif;
  display:flex;flex-direction:column;align-items:center;padding:64px 16px}
h1{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);letter-spacing:.08em;margin:0 0 32px}
ul{list-style:none;padding:0;margin:0;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
a{display:block;padding:18px 22px;background:var(--panel);border:1px solid #3a2c1e;border-radius:6px;
  color:var(--text);text-decoration:none;transition:border-color .15s}
a:hover,a:focus-visible{border-color:var(--gold)}
a strong{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--gold2)}
a span{display:block;color:var(--dim);margin-top:4px}
</style>
</head>
<body>
<h1>Games</h1>
<ul>
  <li><a href="knights-rising.html"><strong>Knights Rising</strong><span>Play in your browser</span></a></li>
  <li><a href="ironfield.html"><strong>Ironfield</strong><span>Tower defense — campaign and online versus</span></a></li>
</ul>
</body>
</html>
